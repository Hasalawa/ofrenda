[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ofrenda"
version = "0.1.0"
description = "A private, offline virtual ofrenda powered by open-weight models (Ollama)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ofrenda = "ofrenda.cli:main"

[tool.setuptools]
packages = ["ofrenda"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
